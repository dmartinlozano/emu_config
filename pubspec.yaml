  gamepads_platform_interface: ^0.1.2+1
  http: ^1.3.0
  internet_connection_checker_plus: ^2.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/i18n/es.json
    - assets/i18n/en.json
